[build-system]
requires = ["setuptools>=77.0.3", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"


[project]
name = "nuvolos-cli"
dynamic = ["version"]
description = "Command-line interface for Nuvolos"
authors = [
    {name = "Alphacruncher", email = "support@nuvolos.cloud"}
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "click>=8.1.7",
    "click-log>=0.4.0",
    "tabulate>=0.9.0",
    "pyyaml>=6.0.1",
    "nuvolos-client-api==1.5.0",
    "humanize>=4.9.0",
    "python-slugify>=8.0.4",
]

[project.optional-dependencies]
dev = [
    "black>=25.1.0",
]
# grade collect needs nuvolos_collect. Do not declare it as a package extra:
# a git URL in Requires-Dist blocks PyPI upload, and current nv-collect pins
# click>=7,<8 which conflicts with nuvolos-cli's click>=8.1.7. Install
# separately when needed:
#   pip install git+https://github.com/alphacruncher/nv-collect.git


[tool.setuptools_scm]


[project.urls]
Repository = "https://github.com/nuvolos-cloud/nuvolos-cli"
Documentation = "https://nuvolos-cli.readthedocs.io/en/latest"

[project.scripts]
nuvolos = "nuvolos_cli.interface:nuvolos"